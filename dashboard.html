<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Bancario P2P</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .status {
      text-align: center;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .status.conectado { color: #4ade80; }
    .status.desconectado { color: #f87171; }
    .stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 15px 25px;
      text-align: center;
      min-width: 140px;
    }
    .stat-card .numero {
      font-size: 32px;
      font-weight: bold;
      color: #38bdf8;
    }
    .stat-card.fraude .numero { color: #f87171; }
    .stat-card .label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
    }
    thead tr { background: #0f172a; }
    th {
      padding: 12px 16px;
      text-align: left;
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    td { padding: 12px 16px; font-size: 14px; border-top: 1px solid #334155; }
    tr.normal:hover { background: #273449; }
    tr.sospechosa {
      background: rgba(248, 113, 113, 0.15);
      animation: pulso 1.5s ease-in-out;
    }
    tr.sospechosa td { color: #fca5a5; }
    tr.failed td { color: #94a3b8; }
    @keyframes pulso {
      0% { background: rgba(248, 113, 113, 0.5); }
      100% { background: rgba(248, 113, 113, 0.15); }
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge.completed { background: #166534; color: #4ade80; }
    .badge.failed { background: #450a0a; color: #f87171; }
    .badge.fraude { background: #7f1d1d; color: #fca5a5; }
    .no-data {
      text-align: center;
      padding: 40px;
      color: #475569;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>🏦 Dashboard Bancario P2P</h1>
  <div class="status desconectado" id="status">⚡ Conectando al servidor...</div>

  <div class="stats">
    <div class="stat-card">
      <div class="numero" id="total">0</div>
      <div class="label">Total Transacciones</div>
    </div>
    <div class="stat-card">
      <div class="numero" id="completadas">0</div>
      <div class="label">Completadas</div>
    </div>
    <div class="stat-card fraude">
      <div class="numero" id="sospechosas">0</div>
      <div class="label">Sospechosas</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID Transacción</th>
        <th>De</th>
        <th>Para</th>
        <th>Monto</th>
        <th>Estado</th>
        <th>Hora</th>
      </tr>
    </thead>
    <tbody id="tabla">
      <tr><td colspan="6" class="no-data">⏳ Esperando transacciones...</td></tr>
    </tbody>
  </table>

  <script>
    const WS_URL = `ws://${window.location.hostname}:8081`;
    let transacciones = new Map();

    function actualizarEstadisticas() {
      const todas = Array.from(transacciones.values());
      document.getElementById('total').textContent = todas.length;
      document.getElementById('completadas').textContent = todas.filter(t => t.status === 'COMPLETED').length;
      document.getElementById('sospechosas').textContent = todas.filter(t => t.fraud).length;
    }

    function renderTabla() {
      const tbody = document.getElementById('tabla');
      const todas = Array.from(transacciones.values()).reverse();

      if (todas.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="no-data">⏳ Esperando transacciones...</td></tr>';
        return;
      }

      tbody.innerHTML = todas.map(tx => {
        const clase = tx.fraud ? 'sospechosa' : (tx.status === 'FAILED' ? 'failed' : 'normal');
        const hora = new Date(tx.timestamp).toLocaleTimeString('es-CO');
        const monto = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'USD' }).format(tx.amount);
        const estadoBadge = tx.fraud
          ? '<span class="badge fraude">🚨 SOSPECHOSA</span>'
          : tx.status === 'COMPLETED'
            ? '<span class="badge completed">✅ COMPLETADA</span>'
            : '<span class="badge failed">❌ FALLIDA</span>';

        return `
          <tr class="${clase}" id="tx-${tx.tx_id}">
            <td>${tx.tx_id.substring(0, 8)}...</td>
            <td>${tx.from_user}</td>
            <td>${tx.to_user}</td>
            <td>${monto}</td>
            <td>${estadoBadge}</td>
            <td>${hora}</td>
          </tr>
        `;
      }).join('');
    }

    function conectar() {
      const ws = new WebSocket(WS_URL);
      const statusEl = document.getElementById('status');

      ws.onopen = () => {
        statusEl.textContent = '🟢 Conectado al servidor en tiempo real';
        statusEl.className = 'status conectado';
      };

      ws.onmessage = (event) => {
        const mensaje = JSON.parse(event.data);

        if (mensaje.type === 'INIT') {
          mensaje.data.forEach(tx => transacciones.set(tx.tx_id, tx));
        } else if (mensaje.type === 'NEW_TRANSACTION') {
          transacciones.set(mensaje.data.tx_id, { ...mensaje.data, fraud: false });
        } else if (mensaje.type === 'FRAUD_ALERT') {
          const tx = transacciones.get(mensaje.data.tx_id);
          if (tx) transacciones.set(mensaje.data.tx_id, { ...tx, fraud: true });
        }

        renderTabla();
        actualizarEstadisticas();
      };

      ws.onclose = () => {
        statusEl.textContent = '🔴 Desconectado — reconectando en 3 segundos...';
        statusEl.className = 'status desconectado';
        setTimeout(conectar, 3000);
      };
    }

    conectar();
  </script>

</body>
</html>
