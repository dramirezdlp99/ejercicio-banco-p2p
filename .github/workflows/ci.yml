name: CI

on:
  push:
    branches:
      - main
      - aws
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - transaction-api
          - transaction-processor
          - fraud-detector
          - dashboard-aggregator
          - notification-router
          - ad-generator
          - email-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        working-directory: ${{ matrix.service }}
        run: node -c index.js

      - name: Docker build
        working-directory: ${{ matrix.service }}
        run: docker build -t ledger-${{ matrix.service }} .
