version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  transaction-api:
    build: ./transaction-api
    container_name: transaction-api
    ports:
      - "3000:3000"
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://rabbitmq

  transaction-processor:
    build: ./transaction-processor
    container_name: transaction-processor
    depends_on:
      - rabbitmq
      - kafka
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - KAFKA_BROKER=kafka:9092

  fraud-detector:
    build: ./fraud-detector
    container_name: fraud-detector
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:9092

  dashboard-aggregator:
    build: ./dashboard-aggregator
    container_name: dashboard-aggregator
    ports:
      - "8081:8081"
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:9092

  notification-router:
    build: ./notification-router
    container_name: notification-router
    depends_on:
      - kafka
      - rabbitmq
    environment:
      - KAFKA_BROKER=kafka:9092
      - RABBITMQ_URL=amqp://rabbitmq

  ad-generator:
    build: ./ad-generator
    container_name: ad-generator
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://rabbitmq

  email-worker:
    build: ./email-worker
    container_name: email-worker
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
