version: '3.9'

x-common-env: &common-env
  RABBITMQ_URL: ${RABBITMQ_URL}
  KAFKA_BROKER: ${KAFKA_BROKER}

x-restart-policy: &restart
  restart: on-failure

x-memory-limit: &mem-128
  deploy:
    resources:
      limits:
        memory: 128m

services:

  transaction-api:
    build: ./transaction-api
    ports:
      - "3000:3000"
    environment:
      <<: *common-env
    <<: [*restart, *mem-128]

  transaction-processor:
    build: ./transaction-processor
    environment:
      <<: *common-env
    <<: [*restart, *mem-128]

  fraud-detector:
    build: ./fraud-detector
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
    <<: [*restart, *mem-128]

  dashboard-aggregator:
    build: ./dashboard-aggregator
    ports:
      - "8081:8081"
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      RABBITMQ_HTTP_API: ${RABBITMQ_HTTP_API}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    <<: [*restart, *mem-128]

  notification-router:
    build: ./notification-router
    environment:
      <<: *common-env
    <<: [*restart, *mem-128]

  ad-generator:
    build: ./ad-generator
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
    <<: [*restart, *mem-128]

  email-worker:
    build: ./email-worker
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
    <<: [*restart, *mem-128]

  dashboard:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    deploy:
      resources:
        limits:
          memory: 32m
